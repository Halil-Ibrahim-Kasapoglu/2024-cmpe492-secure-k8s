apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        imagePullPolicy: Always
        image: 2024cmpe492/backend:latest
        ports:
        - containerPort: 5000
      resources:
        requests:
          cpu: "100m"       
          memory: "256Mi"   
        limits:
          cpu: "200m"       
          memory: "512Mi"   
