apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        imagePullPolicy: IfNotPresent
        image: https://registry.digitalocean.com/cmpe492/frontend:latest
        ports:
        - containerPort: 5001
        env:
        - name: BACKEND_URL
          value: "http://backend-service:5000"
