apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-web-server-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-web-server
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50  # Set target average CPU utilization



